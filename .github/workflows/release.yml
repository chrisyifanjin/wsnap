name: Release

# Push a tag such as v0.1.0 to publish multi-arch images to GHCR and a
# GitHub release with install.yaml pinned to their immutable digests.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag commit passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hack/verify-release-source.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the engine CLIs
        run: |
          hack/install-engines.sh "$RUNNER_TEMP/engines"
          echo "$RUNNER_TEMP/engines" >> "$GITHUB_PATH"
      - name: Unit tests (engine tests run with real Kopia and restic)
        run: make vet test

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images (linux/amd64, linux/arm64)
        run: |
          for target in controller agent; do
            metadata="$RUNNER_TEMP/wsnap-$target-build.json"
            docker buildx build --platform linux/amd64,linux/arm64 --target "$target" \
              --build-arg VERSION="$VERSION" --provenance=true --sbom=true \
              --metadata-file "$metadata" \
              -t "$REGISTRY/wsnap-$target:$VERSION" --push .
            digest=$(jq -er '."containerimage.digest"' "$metadata")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_IMAGE=%s/wsnap-%s@%s\n' "${target^^}" "$REGISTRY" "$target" "$digest" >> "$GITHUB_ENV"
          done
      - name: Render install.yaml
        run: make install-manifest REGISTRY="$REGISTRY" VERSION="$VERSION"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" install.yaml config/prometheus/rules.yaml --generate-notes --verify-tag
