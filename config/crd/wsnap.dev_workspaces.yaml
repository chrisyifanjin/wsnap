---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: workspaces.wsnap.dev
spec:
  group: wsnap.dev
  names:
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repositoryName
      name: Repository
      type: string
    - jsonPath: .status.volume.kind
      name: Volume
      type: string
    - jsonPath: .status.lastSnapshot.time
      name: Last snapshot
      type: date
    - jsonPath: .status.lastSnapshot.executor
      name: Executor
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Workspace is the durable record of one workspace. It outlives the Pods
          and volumes that hold the workspace at any moment. The controller creates
          it the first time it sees a Pod with the wsnap.dev/workspace label.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkspaceSpec is the durable identity of a workspace.
            properties:
              repositoryName:
                description: repositoryName is the SnapshotRepository holding this
                  workspace.
                type: string
              restoreFrom:
                description: |-
                  restoreFrom applies to the next restore after it is set or changed,
                  and only once: status.restoreFromGeneration records that it was used.
                  Create a Workspace with restoreFrom before its first Pod to fork.
                properties:
                  snapshotID:
                    description: snapshotID pins a snapshot. Empty means the source's
                      latest.
                    type: string
                  workspaceName:
                    description: |-
                      workspaceName forks from another workspace in the same namespace.
                      Empty means this workspace, e.g. to roll back to snapshotID.
                    type: string
                type: object
            required:
            - repositoryName
            type: object
          status:
            description: WorkspaceStatus is what wsnap knows about a workspace.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastError:
                type: string
              lastMaintenance:
                format: date-time
                type: string
              lastRestore:
                description: RestoreRecord describes the last restore.
                properties:
                  pod:
                    description: PodRef identifies one Pod incarnation.
                    properties:
                      name:
                        type: string
                      uid:
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  snapshotID:
                    description: snapshotID is empty when the repository had no snapshot
                      yet.
                    type: string
                  sourceWorkspace:
                    description: sourceWorkspace is set when the restore came from
                      another workspace.
                    type: string
                  time:
                    format: date-time
                    type: string
                required:
                - pod
                - time
                type: object
              lastSnapshot:
                description: SnapshotRecord describes one snapshot.
                properties:
                  executor:
                    description: executor is sidecar or mover.
                    type: string
                  final:
                    description: final is true for the last snapshot of a Pod's life.
                    type: boolean
                  id:
                    type: string
                  pod:
                    description: PodRef identifies one Pod incarnation.
                    properties:
                      name:
                        type: string
                      uid:
                        type: string
                    required:
                    - name
                    - uid
                    type: object
                  time:
                    format: date-time
                    type: string
                  volumeName:
                    description: volumeName is the PV a mover snapshotted.
                    type: string
                required:
                - executor
                - id
                - time
                type: object
              restoreFromGeneration:
                description: |-
                  restoreFromGeneration is the metadata.generation whose restoreFrom
                  a restore already used.
                format: int64
                type: integer
              snapshotsSinceMaintenance:
                format: int32
                type: integer
              volume:
                description: VolumeRef is the volume currently holding a workspace's
                  data.
                properties:
                  claimName:
                    description: claimName is empty for emptyDir workspaces.
                    type: string
                  kind:
                    description: kind is persistentVolumeClaim, ephemeral or emptyDir.
                    type: string
                  volumeName:
                    description: volumeName is the bound PersistentVolume.
                    type: string
                required:
                - kind
                type: object
              writerPod:
                description: |-
                  writerPod is the last Pod that received a writing credential. The
                  controller releases a protected volume only after a final snapshot
                  from this Pod (or from a mover).
                properties:
                  name:
                    type: string
                  uid:
                    type: string
                required:
                - name
                - uid
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
