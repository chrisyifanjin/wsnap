apiVersion: v1
kind: ServiceAccount
metadata:
  name: wsnap-controller
  namespace: wsnap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wsnap-controller
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
# The broker checks whether a Pod's service account automounts API tokens.
- apiGroups: [""]
  resources: [serviceaccounts]
  verbs: [get]
- apiGroups: [""]
  resources: [persistentvolumeclaims]
  verbs: [get, list, watch, create, delete]
- apiGroups: [""]
  resources: [persistentvolumes]
  verbs: [get, list, watch, patch, update]
- apiGroups: ["", events.k8s.io]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, delete]
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [wsnap.dev]
  resources: [snapshotrepositories]
  verbs: [get, list, watch]
- apiGroups: [wsnap.dev]
  resources: [workspaces]
  verbs: [get, list, watch, create, update, patch]
# create: the gateway API creates requests on behalf of callers that
# passed a SubjectAccessReview for the same verb.
- apiGroups: [wsnap.dev]
  resources: [workspacesnapshots, workspacerestores]
  verbs: [get, list, watch, create]
- apiGroups: [authorization.k8s.io]
  resources: [subjectaccessreviews]
  verbs: [create]
- apiGroups: [wsnap.dev]
  resources: [workspaces/status, snapshotrepositories/status, workspacesnapshots/status, workspacerestores/status]
  verbs: [get, update, patch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update]
- apiGroups: [admissionregistration.k8s.io]
  resources: [mutatingwebhookconfigurations]
  resourceNames: [wsnap]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wsnap-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wsnap-controller
subjects:
- kind: ServiceAccount
  name: wsnap-controller
  namespace: wsnap-system
---
# The webhook and broker certificate Secrets live in wsnap-system only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wsnap-webhook-cert
  namespace: wsnap-system
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wsnap-webhook-cert
  namespace: wsnap-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wsnap-webhook-cert
subjects:
- kind: ServiceAccount
  name: wsnap-controller
  namespace: wsnap-system
---
# The broker reads each SnapshotRepository's credential Secret (get only;
# Secrets are never listed or cached). By default this applies to every
# namespace. The config/namespaced-secrets overlay removes the
# ClusterRoleBinding; then bind this ClusterRole with a RoleBinding in each
# namespace that has repositories (config/samples/secret-access.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wsnap-secret-reader
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wsnap-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wsnap-secret-reader
subjects:
- kind: ServiceAccount
  name: wsnap-controller
  namespace: wsnap-system
