# Lets wsnap read SnapshotRepository Secrets in this namespace. Apply it in
# every namespace that has repositories, including with config/default:
# kubectl -n agents apply -f config/samples/secret-access.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wsnap-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wsnap-secret-reader
subjects:
- kind: ServiceAccount
  name: wsnap-controller
  namespace: wsnap-system
