# Lets wsnap read SnapshotRepository Secrets in this namespace when it is
# installed with config/namespaced-secrets. Apply it in each namespace that
# has repositories: kubectl -n agents apply -f secret-access.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wsnap-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wsnap-secret-reader
subjects:
- kind: ServiceAccount
  name: wsnap-controller
  namespace: wsnap-system
