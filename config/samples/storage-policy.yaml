# Example for the agents namespace. Replace wsnap-safe with a StorageClass
# whose provisioner, encryption, topology, and reclaim behavior you reviewed.
apiVersion: v1
kind: LimitRange
metadata:
  name: wsnap-storage
  namespace: agents
spec:
  limits:
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 10Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: wsnap-storage
  namespace: agents
spec:
  hard:
    persistentvolumeclaims: "20"
    requests.storage: 100Gi
---
# Bind this cluster-scoped admission policy only to namespaces explicitly
# labeled wsnap.dev/storage-policy=safe. A PVC must select the reviewed class.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: wsnap-storage-class.wsnap.dev
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["persistentvolumeclaims"]
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        (has(object.spec.storageClassName) &&
         object.spec.storageClassName == 'wsnap-safe')
      message: "PVCs in this namespace must use the reviewed wsnap-safe StorageClass"
    # Reserve creation and deletion of rescue claims for wsnap. Kubernetes
    # storage controllers must still update them to bind volumes and manage
    # protection finalizers. On DELETE, oldObject holds the stored PVC. Allow
    # cleanup after the namespace enters deletion. Adapt the service account
    # identity if installed outside wsnap-system.
    - expression: >-
        request.operation == 'UPDATE' ||
        request.userInfo.username ==
        'system:serviceaccount:wsnap-system:wsnap-controller' ||
        (request.operation == 'DELETE'
          ? (!oldObject.metadata.name.startsWith('wsnap-rescue-') ||
             has(namespaceObject.metadata.deletionTimestamp))
          : (!object.metadata.name.startsWith('wsnap-rescue-') &&
             (!has(object.metadata.generateName) ||
              !object.metadata.generateName.startsWith('wsnap-rescue-'))))
      message: "only the wsnap controller may create or delete wsnap-rescue- PVCs"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: wsnap-storage-class.wsnap.dev
spec:
  policyName: wsnap-storage-class.wsnap.dev
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        wsnap.dev/storage-policy: safe
