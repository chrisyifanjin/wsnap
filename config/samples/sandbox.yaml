# Requires agent-sandbox. Put this Sandbox in the same namespace as the
# SnapshotRepository and its Secret. The wsnap webhook injects the sidecar.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: my-agent
spec:
  volumeClaimTemplates:
  - metadata: {name: workspace}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 10Gi}}
  podTemplate:
    metadata:
      labels:
        wsnap.dev/workspace: user-42-project-x
        wsnap.dev/repository: default
    spec:
      automountServiceAccountToken: false
      containers:
      - name: agent
        image: alpine:3.22
        command: [sleep, infinity]
        volumeMounts:
        - {name: workspace, mountPath: /workspace}
